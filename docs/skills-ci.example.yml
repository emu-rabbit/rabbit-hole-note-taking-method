name: Local skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - '.gitattributes'
      - '.github/workflows/skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-15
            python: '3.13'
          - os: windows-2025
            python: '3.13'
          - os: windows-2025
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Record real platform
        run: python -c "import platform, sys; print(platform.platform()); print(sys.version)"
      - name: Validate bundle
        run: python -B scripts/validate-skills.py
      - name: Exercise fictional workflows and native filesystem boundaries
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
